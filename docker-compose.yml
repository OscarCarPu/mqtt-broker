services:
  mosquitto:
    image: eclipse-mosquitto:2.0 
    container_name: mosquitto
    hostname: mosquitto
    # The default command points at /mosquitto/config/mosquitto.conf, which is
    # no longer where the config lives.
    command: ["/usr/sbin/mosquitto", "-c", "/etc/mosquitto/mosquitto.conf"]
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      # The image entrypoint runs `chown -R mosquitto:mosquitto /mosquitto` on
      # every start, which takes any repo file under that path away from the
      # host user and breaks git. The tracked config is therefore mounted
      # outside /mosquitto, and read-only since the broker never writes it.
      - ./mosquitto/config:/etc/mosquitto:ro
      # Runtime state, gitignored, left inside /mosquitto so the entrypoint's
      # chown keeps it owned by the broker.
      - ./mosquitto/secrets:/mosquitto/secrets
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    restart: unless-stopped
    networks:
      - mqtt-net 

  mosquitto-ui:
    image: smeagolworms4/mqtt-explorer
    container_name: mosquitto-ui
    ports:
      - "4000:4000"
    volumes:
      - ./mqtt-explorer/config:/mqtt-explorer/config
    environment:
      # Seeds config/settings.json on first start only - the UI owns that file
      # afterwards, which is why it is gitignored. Values come from .env so the
      # broker password never lands in the repository.
      INITIAL_CONFIG: >-
        {"connections":[{"configVersion":1,"type":"mqtt","id":"home-lab",
        "name":"home lab","host":"${MQTT_HOST:-mosquitto}",
        "port":${MQTT_PORT:-1883},"protocol":"mqtt","basePath":"",
        "username":"${MQTT_USERNAME:-}","password":"${MQTT_PASSWORD:-}",
        "encryption":false,"certValidation":false,
        "clientId":"mqtt-explorer-home-lab",
        "subscriptions":[{"topic":"#","qos":0}]}]}
    restart: unless-stopped
    depends_on:
      - mosquitto
    networks:
      - mqtt-net

networks:
  mqtt-net:
    driver: bridge
